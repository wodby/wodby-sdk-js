name: Build

on:
  push:
    branches:
      - 2.0
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Build generated SDK
        run: make build

      - name: Test package entrypoint
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
