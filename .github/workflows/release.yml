name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: make build

      - name: Test package entrypoint
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Extract release notes from tag
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must have a description"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Publish package to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ secrets.NPM_OTP }}
        run: |
          if [[ -n "${NPM_TOKEN}" ]]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"

            if [[ -z "${NPM_OTP}" ]]; then
              echo "Skipping npm publish because NPM_TOKEN is configured but NPM_OTP is not set."
              exit 0
            fi

            npm publish --otp "${NPM_OTP}"
          else
            npm publish
          fi
