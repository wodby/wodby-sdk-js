name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  # Backfill a tag when an earlier release run did not reach npm publication.
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated semver tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version ${RELEASE_VERSION} must use x.y.z format"
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_VERSION}" 2>/dev/null)" != "tag" ]]; then
            echo "::error::Release tag ${RELEASE_VERSION} must be annotated"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Set package version from tag
        run: npm version "${RELEASE_VERSION}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: make build

      - name: Test package entrypoint
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Extract release notes from tag
        run: |
          git for-each-ref "refs/tags/${RELEASE_VERSION}" --format='%(contents)' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release tag ${RELEASE_VERSION} must have a description"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Publish package to npm
        run: npm publish
